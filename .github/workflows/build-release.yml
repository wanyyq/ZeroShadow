name: Build release archives

# Produces one archive per platform, named ZeroShadow-<version>-<platform>.zip.
# All the real work lives in build-release.ps1 / package-release.ps1, which are
# the same scripts Auto-building.bat calls locally - that is deliberate, so the
# CI and local builds cannot drift apart.

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"
    # 这里刻意**不加** paths 过滤。
    #
    # 原因（这是踩过的坑）：GitHub 会把 paths 过滤同时应用到标签推送。而
    # `git tag v1.0.0 && git push --tags` 常常是「标签指向刚推过的那个提交」，
    # 此时标签推送的变更集为空 → 不匹配任何 paths → 工作流根本不触发 →
    # 一个 Release 都不会产生。发版恰恰最依赖标签触发，所以标签这条路必须无条件跑。
    #
    # 代价是推 main 也会构建 5 个平台。若想省 CI 时间，用下面的 paths-ignore
    # 把纯文档改动排除掉（注意仍然是 ignore 而不是白名单，标签推送不受影响）。
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".gitignore"
      - ".gitattributes"
  pull_request:
    paths:
      - "server/**"
      - "web/**"
      - "build-release.ps1"
      - "package-release.ps1"
      - ".github/workflows/build-release.yml"

# Needed so a tag build can attach its archives to a GitHub Release.
permissions:
  contents: write

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      # One broken platform must not hide the results of the other five.
      fail-fast: false
      matrix:
        include:
          # pkg cross-builds by downloading a prebuilt runtime, but building
          # each platform on its native OS is by far the most reliable.
          #
          # windows-x32 (node18-win-x86) is deliberately absent: pkg-fetch has
          # never published a win-x86 base runtime for ANY Node version, so the
          # target cannot be produced at all. See the target table comment in
          # build-release.ps1 for the evidence. Requesting it there fails loudly
          # with an explanation instead of a cryptic pkg 404.
          - os: windows-latest
            platform: windows-x64
          # windows-arm64 currently FAILS inside pkg (not a config problem).
          # Evidence: the base runtime for it downloads fine and its SHA256
          # matches pkg-fetch's own EXPECTED_HASHES exactly, yet pkg 5.8.1 still
          # fails afterwards. So this is a pkg limitation for win-arm64.
          # continue-on-error keeps that failure from blocking the other four
          # archives and the Release. Remove it once the toolchain is fixed
          # (e.g. by switching to @yao-pkg/pkg).
          - os: windows-latest
            platform: windows-arm64
            experimental: true
          - os: ubuntu-latest
            platform: linux-x64
          - os: ubuntu-latest
            platform: linux-arm64
          # Statically linked: pkg-fetch ships linuxstatic-armv7 but no plain
          # linux-armv7, and a static binary is better for distribution anyway.
          - os: ubuntu-latest
            platform: linux-armv7

    # 被标记为 experimental 的平台允许失败：这样 4 个能出来的归档 + Release
    # 不会被一个平台拖住。日志里那一格仍会显示红色，便于日后排查。
    continue-on-error: ${{ matrix.experimental == true }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # pnpm must be installed before setup-node so its cache integration works.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      # NOTE ON THE NODE VERSION
      #   The host Node here is NOT the Node that ends up inside the shipped
      #   binary. pkg embeds the node18 runtime because build-release.ps1 passes
      #   --target node18-<os>-<arch>. A modern host is required anyway: Vite 8
      #   and @vitejs/plugin-react 6 declare engines ^20.19.0 || >=22.12.0, so
      #   the frontend simply cannot be built on Node 18.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            server/pnpm-lock.yaml
            web/pnpm-lock.yaml

      - name: Show toolchain
        shell: pwsh
        run: |
          Write-Host "host node: $(node -v)"
          Write-Host "pnpm:      $(pnpm -v)"
          Write-Host "pwsh:      $($PSVersionTable.PSVersion)"

      - name: Build and package ${{ matrix.platform }}
        shell: pwsh
        run: |
          ./build-release.ps1 -Targets ${{ matrix.platform }} -FrozenLockfile

      # Enforces what the archive must ship: the binary, the built frontend, the
      # config template, the licence and every user manual. A warning from the
      # packaging script is not enough in CI - missing documentation should fail
      # the build.
      - name: Verify archive contents
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Add-Type -AssemblyName System.IO.Compression.FileSystem

          $archive = Get-ChildItem -Path "ZeroShadow-*.zip" | Select-Object -First 1
          if (-not $archive) { throw "the build produced no ZeroShadow-*.zip archive" }

          $zip = [System.IO.Compression.ZipFile]::OpenRead($archive.FullName)
          try {
            $names = @($zip.Entries | ForEach-Object { $_.FullName -replace '\\', '/' })
          } finally {
            $zip.Dispose()
          }

          Write-Host "archive : $($archive.Name)"
          Write-Host "entries : $($names.Count)"

          $missing = @()
          foreach ($required in @('web/dist/index.html', 'LICENSE', 'README.md', '.env.example')) {
            if ($names -notcontains $required) { $missing += $required }
          }
          # ZeroShadow.exe on Windows, bare ZeroShadow on Linux, at archive root.
          if (-not ($names | Where-Object { $_ -match '^ZeroShadow(\.exe)?$' })) {
            $missing += 'ZeroShadow[.exe]'
          }
          $manuals = @($names | Where-Object { $_ -match '^docs/.+\.md$' })
          if ($manuals.Count -eq 0) { $missing += 'docs/*.md (user manuals)' }

          if ($missing.Count -gt 0) {
            Write-Host "archive is missing required entries:" -ForegroundColor Red
            $missing | ForEach-Object { Write-Host "  $_" -ForegroundColor Red }
            throw "release archive is incomplete"
          }

          Write-Host "verified: binary + web/dist + LICENSE + README.md + .env.example + $($manuals.Count) manual(s)" -ForegroundColor Green

          # Secrets must never survive into a published archive.
          $forbidden = @($names | Where-Object {
            $_ -match '(^|/)\.env$' -or $_ -match 'jwt-secret' -or
            $_ -match '(^|/)users\.json$' -or $_ -match '(^|/)config\.json$' -or
            $_ -match '\.log$'
          })
          if ($forbidden.Count -gt 0) {
            Write-Host "archive contains secret material:" -ForegroundColor Red
            $forbidden | ForEach-Object { Write-Host "  $_" -ForegroundColor Red }
            throw "secret gate failed in CI"
          }
          Write-Host "secret gate: clean" -ForegroundColor Green

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-archive
          path: ZeroShadow-*.zip
          if-no-files-found: error
          retention-days: 30

  # ---------------------------------------------------------------------------
  #  发布：把各平台的归档汇总到一个 Release 里
  #
  #  为什么不放在上面的矩阵 job 里逐台上传（原来就是这么写的，已改）：
  #  4 个 job 会**并发**去 gh release create 同一个标签，先到者成功、后到者
  #  报 "already exists" 而失败——而那几个 job 本身构建是成功的。集中到这里的
  #  一个 job 做，既没有竞态，也只需要一次 API 调用。
  # ---------------------------------------------------------------------------
  release:
    name: Publish release
    needs: build
    # 只在推 v* 标签时发布；分支推送与 PR 只留 Actions 产物。
    #
    # 为什么必须带 always()：默认行为是「needs 的 job 失败/被跳过 → 本 job 也被跳过」。
    # 那样只要有一个平台失败，Release 就会**静默不发布**。always() 保证标签推送
    # 一定会走到这里，再由下面的「必需平台检查」明确判断该不该发、以及发哪些。
    if: always() && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # ⚠️ 这一行是必需的，别删。
      #
      # gh 的 release 子命令需要知道目标仓库，它按
      #   --repo 参数 > GH_REPO 环境变量 > 当前目录的 git remote
      # 的顺序解析。而本 job **没有 checkout**（也不需要源码），所以目录里没有
      # .git、也就没有 git remote；不给 GH_REPO 的话 gh 会报
      #   "not a git repository" / "could not determine base repo"
      # 在 7 秒内直接失败 —— 这正是「Publish release 7 秒失败」的原因。
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download all archives
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: "*-archive"
          merge-multiple: true

      - name: Check which platforms made it
        shell: bash
        run: |
          set -euo pipefail
          ls -lh artifacts/ || true
          echo "----- 各平台归档 -----"
          REQUIRED="windows-x64 linux-x64 linux-arm64 linux-armv7"
          MISSING=""
          for p in $REQUIRED; do
            if ls artifacts/ZeroShadow-*-"$p".zip >/dev/null 2>&1; then
              echo "  [ok]   $p"
            else
              echo "  [MISS] $p"
              MISSING="$MISSING $p"
            fi
          done
          # windows-arm64 目前受 pkg 限制，缺了只警告不拦
          if ls artifacts/ZeroShadow-*-windows-arm64.zip >/dev/null 2>&1; then
            echo "  [ok]   windows-arm64"
          else
            echo "  [warn] windows-arm64 缺失（pkg 对该目标的已知限制）"
          fi
          if [ -n "$MISSING" ]; then
            echo "::error::必需平台未产出归档:$MISSING —— 拒绝发布不完整的 Release"
            exit 1
          fi
          echo "----- 全部必需平台就位 -----"

      - name: Create release and upload archives
        shell: bash
        env:
          # 优先用你自己配的 RELEASE_TOKEN（见下方说明），没配就退回内置 token。
          #
          # 为什么需要这个后备：仓库/组织的 Settings → Actions → General →
          # Workflow permissions 若是「Read repository contents permissions」，
          # 那么即使本文件里写了 permissions: contents: write，GitHub 也会把
          # GITHUB_TOKEN **降级为只读**，gh release create 于是报
          # "Resource not accessible by integration (HTTP 403)"。
          # 那种情况下改仓库设置，或配一个带 repo 权限的 PAT 存成 RELEASE_TOKEN 即可。
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
        # 注意：这里刻意**不用** set -e，而是手动接住每条命令的输出，
        # 好把 gh 的原始报错写进 Annotations 与 Summary —— 否则失败原因只存在于
        # 日志里，而日志端点需要鉴权、外部读不到，排查会非常费劲。
        run: |
          set -uo pipefail
          TAG="$GITHUB_REF_NAME"
          SUMMARY="$GITHUB_STEP_SUMMARY"

          {
            echo "## 发布 $TAG"
            echo ""
          } >> "$SUMMARY"

          # 用哪个凭据：内置 token 还是你自己的 PAT
          identity="$(gh api /user --jq .login 2>&1)" || identity="(读取失败)"
          echo "- token 身份：\`$identity\`" >> "$SUMMARY"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "- Release 已存在，改为覆盖上传" >> "$SUMMARY"
          else
            echo "- 正在创建 Release …" >> "$SUMMARY"
            if ! out="$(gh release create "$TAG" --title "$TAG" --generate-notes 2>&1)"; then
              echo "::error title=gh release create 失败::$(printf '%s' "$out" | head -3 | tr '\n' ' ')"
              {
                echo ""
                echo "### ❌ 创建 Release 失败"
                echo ""
                echo '```text'
                printf '%s\n' "$out"
                echo '```'
                echo ""
                echo '> 最常见原因：仓库 **Settings → Actions → General → Workflow permissions**'
                echo '> 为只读，导致 `GITHUB_TOKEN` 被降级（workflow 里写 `contents: write` 也提不了权）。'
                echo '> 改成 **Read and write permissions**，或配一个 \`RELEASE_TOKEN\` secret。'
              } >> "$SUMMARY"
              exit 1
            fi
          fi

          if ! out="$(find artifacts -name 'ZeroShadow-*.zip' -print0 | xargs -0 gh release upload "$TAG" --clobber 2>&1)"; then
            echo "::error title=上传归档失败::$(printf '%s' "$out" | head -3 | tr '\n' ' ')"
            {
              echo ""
              echo "### ❌ 上传归档失败"
              echo ""
              echo '```text'
              printf '%s\n' "$out"
              echo '```'
            } >> "$SUMMARY"
            exit 1
          fi

          {
            echo ""
            echo "### ✅ 已发布的归档"
            echo ""
            gh release view "$TAG" --json assets \
              --jq '.assets[] | "- `\(.name)`  \(.size/1048576*100|floor/100) MB"'
          } >> "$SUMMARY"

